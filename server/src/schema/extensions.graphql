extend type Query {
  """Personal notes owned by the authenticated user (excludes org notes)."""
  myNotes: [Note!]!

  """Orgs the authenticated user is a member of."""
  myOrgs: [Org!]!

  """Returns the currently authenticated user."""
  me: User

  """API tokens for the given org. Caller must be a member of that org."""
  apiTokens(orgId: String!): [ApiToken!]!
}

extend type Mutation {
  """
  Request a magic link to be sent to the given email.
  In development the link is returned directly; in production it is logged
  (TODO: send via email provider).
  """
  requestMagicLink(email: String!): RequestMagicLinkResult!

  """Verify a magic-link token and return a session token."""
  verifyMagicLink(token: String!): AuthPayload!

  """
  Create an API token scoped to a single org. The caller must be a member of
  the org. The full plaintext token is returned exactly once in the result —
  it is hashed before storage and can never be retrieved again.
  """
  createApiToken(orgId: String!, name: String!): CreateApiTokenResult!

  """Revoke (permanently delete) an API token the caller is allowed to manage."""
  revokeApiToken(id: String!): Boolean!
}

"""
An API token's non-secret metadata. The token value itself is never returned
except once, at creation time, via CreateApiTokenResult.token.
"""
type ApiToken {
  id: String!
  orgId: String!
  name: String!
  """Non-secret display prefix (e.g. `cet_a1b2c3d4`) to identify the token."""
  tokenPrefix: String!
  """User who created the token."""
  createdByUserId: String!

  """DateTime"""
  lastUsedAt: DateTime

  """DateTime"""
  createdAt: DateTime!
}

type CreateApiTokenResult {
  apiToken: ApiToken!
  """The full plaintext token — shown only once. Store it now; it is unrecoverable."""
  token: String!
}

type RequestMagicLinkResult {
  """Always true on success."""
  success: Boolean!
  """In development only: the full magic-link URL so the client can bypass email."""
  devLink: String
}

type AuthPayload {
  """Opaque session token — send as Bearer in Authorization header."""
  token: String!
  user: User!
}
