type User {
  id: String!
  email: String!

  """DateTime"""
  createdAt: DateTime!

  """DateTime"""
  updatedAt: DateTime!
  notes(where: NoteFilters, orderBy: NoteOrderBy, offset: Int, limit: Int): [Note!]!
  orgMemberships(where: OrgMemberFilters, orderBy: OrgMemberOrderBy, offset: Int, limit: Int): [OrgMember!]!
}

type Note {
  id: String!
  userId: String!
  orgId: String
  title: String!
  content: String!

  """DateTime"""
  createdAt: DateTime!

  """DateTime"""
  updatedAt: DateTime!
  user(where: UserFilters): User
  org(where: OrgFilters): Org
}

type Org {
  id: String!
  name: String!

  """DateTime"""
  createdAt: DateTime!

  """DateTime"""
  updatedAt: DateTime!
  notes(where: NoteFilters, orderBy: NoteOrderBy, offset: Int, limit: Int): [Note!]!
  members(where: OrgMemberFilters, orderBy: OrgMemberOrderBy, offset: Int, limit: Int): [OrgMember!]!
}

type OrgMember {
  orgId: String!
  userId: String!
  role: OrgMembersRoleEnum!

  """DateTime"""
  createdAt: DateTime!
  org(where: OrgFilters): Org
  user(where: UserFilters): User
}

type Query {
  user(offset: Int, limit: Int, orderBy: UserOrderBy, where: UserFilters): [User!]!
  userSingle(offset: Int, orderBy: UserOrderBy, where: UserFilters): User
  note(offset: Int, limit: Int, orderBy: NoteOrderBy, where: NoteFilters): [Note!]!
  noteSingle(offset: Int, orderBy: NoteOrderBy, where: NoteFilters): Note
  org(offset: Int, limit: Int, orderBy: OrgOrderBy, where: OrgFilters): [Org!]!
  orgSingle(offset: Int, orderBy: OrgOrderBy, where: OrgFilters): Org
  orgMember(offset: Int, limit: Int, orderBy: OrgMemberOrderBy, where: OrgMemberFilters): [OrgMember!]!
  orgMemberSingle(offset: Int, orderBy: OrgMemberOrderBy, where: OrgMemberFilters): OrgMember

  """Notes owned by the authenticated user, plus notes in all their orgs."""
  myNotes: [Note!]!

  """Orgs the authenticated user is a member of."""
  myOrgs: [Org!]!
}

type Mutation {
  insertIntoUsers(values: [InsertIntoUserInput!]!): [User!]!
  insertIntoUser(values: InsertIntoUserInput!): User
  updateUsers(set: UpdateUserInput!, where: UserFilters): [User!]!
  deleteFromUsers(where: UserFilters): [User!]!
  insertIntoNotes(values: [InsertIntoNoteInput!]!): [Note!]!
  insertIntoNote(values: InsertIntoNoteInput!): Note
  updateNotes(set: UpdateNoteInput!, where: NoteFilters): [Note!]!
  deleteFromNotes(where: NoteFilters): [Note!]!
  insertIntoOrgs(values: [InsertIntoOrgInput!]!): [Org!]!
  insertIntoOrg(values: InsertIntoOrgInput!): Org
  updateOrgs(set: UpdateOrgInput!, where: OrgFilters): [Org!]!
  deleteFromOrgs(where: OrgFilters): [Org!]!
  insertIntoOrgMembers(values: [InsertIntoOrgMemberInput!]!): [OrgMember!]!
  insertIntoOrgMember(values: InsertIntoOrgMemberInput!): OrgMember
  updateOrgMembers(set: UpdateOrgMemberInput!, where: OrgMemberFilters): [OrgMember!]!
  deleteFromOrgMembers(where: OrgMemberFilters): [OrgMember!]!

  """Create a new org and add the caller as owner."""
  createOrg(name: String!): Org!

  """
  Add a user to an org. Caller must be an owner of the org.
  Defaults to role 'member' if not specified.
  """
  addOrgMember(orgId: String!, userId: String!, role: OrgMembersRoleEnum): OrgMember!

  """Remove a user from an org. Caller must be an owner of the org."""
  removeOrgMember(orgId: String!, userId: String!): OrgMember!

  """
  Create a note. If orgId is supplied the note belongs to the org (caller
  must be a member); otherwise it is a personal note.
  """
  createNote(title: String, content: String, orgId: String): Note!
}